<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    The Yard mark: a bounded plot with a gate broken into its top edge,
    holding a letter. Enclosure plus intake plus contents - receive, hold,
    dispatch, which is what the product does.

    Referenced from BrandMark.vue through an external <use>, never
    inlined into a page.

    NO <style> BLOCK, and none may be added. WebKit does not apply a
    stylesheet from the referenced document to what <use> clones out of
    it, so every fill and stroke rode along as a presentation attribute
    on the element itself - with a stylesheet the enclosure filled solid
    and the mark was a black square in Safari, while Chromium and
    Firefox drew it correctly. The enclosure is currentColor, so the
    mark takes the colour of whatever it sits in. The letter asks for
    the page's accent through a style attribute, which travels with the
    element, and falls back to currentColor in the var() itself, so a
    browser that resolves neither still draws the mark in one colour.

    Two symbols, one silhouette. Below about 20px the stroked envelope's
    flap crease turns to noise inside the rectangle, so mark-small swaps
    it for a solid letter and thickens the enclosure.
  -->
  <symbol id="mark" viewBox="0 0 32 32">
    <path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" d="M11.5 4.6H7.2a3 3 0 0 0-3 3v17.2a3 3 0 0 0 3 3h17.6a3 3 0 0 0 3-3V7.6a3 3 0 0 0-3-3h-4.3"/>
    <rect fill="none" stroke="currentColor" style="stroke: var(--accent-fg, currentColor)" stroke-width="2.1" x="9" y="14.6" width="14" height="9.6" rx="1.6"/>
    <path fill="none" stroke="currentColor" style="stroke: var(--accent-fg, currentColor)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M9.6 16.4 16 21.1l6.4-4.7"/>
  </symbol>
  <symbol id="mark-small" viewBox="0 0 32 32">
    <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M11.5 4.6H7.2a3 3 0 0 0-3 3v17.2a3 3 0 0 0 3 3h17.6a3 3 0 0 0 3-3V7.6a3 3 0 0 0-3-3h-4.3"/>
    <rect fill="currentColor" stroke="none" style="fill: var(--accent-fg, currentColor)" x="9.2" y="15" width="13.6" height="9" rx="2"/>
  </symbol>
</svg>
