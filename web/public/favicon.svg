<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Mailyard. A bounded plot with a gate in its top edge, holding a letter.

    Small optical variant: solid letter and a heavier enclosure, because
    below ~20px a stroked envelope's flap crease turns to noise inside the
    rectangle. The full mark lives in
    docs/themes/mailyard/static/assets/logo/logo.svg, and the console
    draws both variants out of web/src/assets/brand-mark.svg.

    A favicon renders outside the page, so currentColor is unavailable and
    the colours are stated. The neutral holds on both a light and a dark
    tab bar, and the media query lifts it where the browser reports a theme.
  -->
  <style>
    .plot { stroke: #525252; }
    .letter { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .plot { stroke: #a1a1a1; }
      .letter { fill: #fafafa; }
    }
  </style>
  <path class="plot" fill="none" stroke-width="2.6" stroke-linecap="round" d="M11.5 4.6H7.2a3 3 0 0 0-3 3v17.2a3 3 0 0 0 3 3h17.6a3 3 0 0 0 3-3V7.6a3 3 0 0 0-3-3h-4.3"/>
  <rect class="letter" x="9.2" y="15" width="13.6" height="9" rx="2"/>
</svg>
