# The default linter set, which is errcheck, govet, ineffassign,
# staticcheck and unused. Nothing extra is enabled: this runs on every
# `task check`, so a linter earns its place by catching something the
# compiler and the guards in tests/ do not.
#
# gosec is deliberately absent. Its G201/G202 were measured against this
# tree and reported nothing on a textbook Sprintf injection, while
# TestNoDynamicSQL catches exactly that.
version: "2"

linters:
  default: standard

  # Three resource linters on top of the default set. They are the ones
  # that were clean or nearly clean here, so they cost four fixes once
  # and then only ever fire on a regression.
  #
  # The other four from the same family were measured and DECLINED:
  # nilerr, noctx and contextcheck report 31 sites between them and
  # every one is deliberate - the (ok, resp) refusal helpers return nil
  # after a non-nil error by design, and the webhook dispatcher uses a
  # background context because the request it came from is gone. That
  # is 31 suppressions to buy nothing, which is the noise this file
  # exists to avoid.
  enable:
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # errorlint keeps an error in the chain where errors.Is and errors.As
    # can reach it. The rest were clean when added and only ever fire on
    # a regression.
    - errorlint
    - copyloopvar
    - durationcheck
    - intrange
    - misspell
    - nolintlint
    - unconvert
    - wastedassign

  # internal/third_party holds code carried in from elsewhere with one
  # deliberate change each, read and tested as published. Linting it
  # reports the upstream author's style, 25 findings on go-pkcs12
  # alone, and every one fixed here is a line that drifts from the
  # copy a cherry-pick has to land on.
  exclusions:
    paths:
      - internal/third_party/

  settings:
    staticcheck:
      checks:
        - all
        # QF1001 rewrites `!(r >= 'a' && r <= 'z')` into
        # `r < 'a' || r > 'z'`. The first says "not in this range" and
        # the second makes the reader reconstruct that, so the hint is
        # declined rather than worked around at each of its three sites.
        - -QF1001
