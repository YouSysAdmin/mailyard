# Mailyard documentation site - the DEFAULT environment, which is the build
# the binary embeds. config/pages/hugo.toml is layered over this one by
# `hugo -e pages` for GitHub Pages: same content, same theme, and the home
# page becomes the landing (params.landing) instead of the documentation
# index. Nothing else differs, so a page reads the same on both.
#
# The build output is EMBEDDED IN THE BINARY (docs/dist, see docsite.go) and
# served under /docs by the running instance, which is why baseURL is a bare
# path: every asset and link the theme emits goes through relURL/RelPermalink,
# so /docs/ is the only prefix that has to be stated. `hugo server` keeps that
# path too, so links are identical in dev and in the product.
baseURL = "/docs/"
publishDir = "dist"

title = "Mailyard"
themesDir = "themes"
theme = "mailyard"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# This build answers behind a console session, so a sitemap, a robots.txt
# and RSS feeds are files nobody can fetch and no crawler will ask for.
# The pages environment turns robots.txt back on. Tags are not used.
enableRobotsTXT = false
disableKinds = ["RSS", "sitemap", "taxonomy", "term"]

[params]
author = "YouSysAdmin"
brand = "Mailyard"
description = "Self-hosted email delivery platform for developers"

# Fifteen sections, so the sidebar starts collapsed and opens the one
# holding the current page.
sidebarCollapsible = true
sidebarCollapsed = true

# Repository links: the project column in the footer, an edit-on-github
# link under the TOC and the GitHub button in the top bar. edit_base is
# joined with .File.Path, which is relative to contentDir (content/en), so
# it stops at docs/content/en/.
show_footer_project = true
repoURL = "https://github.com/YouSysAdmin/mailyard"
edit_base = "https://github.com/YouSysAdmin/mailyard/edit/master/docs/content/en/"
cta_url = "https://github.com/YouSysAdmin/mailyard"
cta_label = "GitHub"
cta_icon = "github"

# Top navigation. Four entries, not all fifteen sections: the sidebar is
# the map, and this is the shortlist somebody arrives wanting.
[[menu.main]]
name = "Getting Started"
url = "/getting-started/"
weight = 10
[menu.main.params]
icon = "rocket"

[[menu.main]]
name = "Email Sending"
url = "/email-sending/"
weight = 20
[menu.main.params]
icon = "mail"

[[menu.main]]
name = "Templates"
url = "/templates/"
weight = 30
[menu.main.params]
icon = "file-text"

[[menu.main]]
name = "Security"
url = "/security/"
weight = 40
[menu.main.params]
icon = "shield"

# One language today. The structure (content/en, a [languages.en] block) is
# what a second one needs, so adding it is a directory and an i18n file
# rather than a re-layout.
[languages.en]
label = "English"
weight = 1
contentDir = "content/en"
title = "Mailyard"

[languages.en.params]
description = "Self-hosted email delivery platform for developers"

[markup]
[markup.goldmark.renderer]
# The pages carry raw HTML (line breaks inside table cells, the odd
# details block), which goldmark drops unless it is allowed through.
unsafe = true
[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false
[markup.highlight]
style = "github-dark"
lineNos = false
noClasses = true
tabWidth = 2
codeFences = true
guessSyntax = true

# JSON on the home page is the client-side search index (the theme's
# layouts/index.json), fetched by the search dialog on first open.
[outputs]
home = ["HTML", "JSON"]
page = ["HTML"]
section = ["HTML"]
