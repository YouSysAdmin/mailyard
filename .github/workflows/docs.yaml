# GitHub Pages: the documentation site the binary embeds, built in the
# `pages` environment (docs/config/pages), which makes the home page the
# landing, under whatever baseURL Pages hands out. No Node, Go or Sass:
# the theme is plain CSS and JS bundled by Hugo pipes.
name: Docs build and deploy
on:
  release:
    types: [ created ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # PUBLIC REPOSITORY ONLY, guarded by name the way release.yaml is. This
  # file is shared with the private overlay, which has no Pages site and
  # whose token cannot deploy one, so a release there ran this and failed.
  # deploy follows through needs: a skipped build skips it.
  build:
    if: github.repository == 'YouSysAdmin/mailyard'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
      TZ: Europe/Kyiv
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      # --destination overrides publishDir (dist, which is what the binary
      # embeds and .gitignore expects).
      - name: Build the site
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          hugo build --source ./docs -e pages --minify \
            --baseURL "${BASE}/" \
            --cacheDir "${RUNNER_TEMP}/hugo_cache" \
            --destination "${GITHUB_WORKSPACE}/site"
      - name: Cache save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
