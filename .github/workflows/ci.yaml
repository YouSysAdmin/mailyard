name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with: { go-version: '1.27' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the console dependencies
        run: npm ci
        working-directory: web

      - uses: go-task/setup-task@v1
        with: { version: '3.x' }

      # install-only, so the gate stays `task check` and CI cannot
      # drift from what a developer runs - the action just puts the
      # PREBUILT release binary on the PATH. Pinned, because a linter
      # that changes its mind between runs fails builds nobody broke.
      #
      # THE PIN MOVES WITH THE GO VERSION IN go.mod. A golangci-lint
      # binary refuses a target newer than the Go it was built with, and
      # `go version -m` on the release binary says which that is.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true

      # vet, golangci-lint, tests, gofmt, vue-tsc and prettier. The store
      # tests SKIP without MAILYARD_TEST_DSN, and the two database-backed
      # guards with them - see the store job below.
      - run: task check

  # The two guards that need a real Postgres: schemaguard PREPAREs every
  # query against the migrated schema, tenancyguard asks the schema
  # which tables carry project_id. Without a database they skip, and a
  # guard that skips reads exactly like a guard that passes.
  store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailyard
          POSTGRES_PASSWORD: mailyard
          POSTGRES_DB: mailyard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailyard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with: { go-version: '1.27' }

      # -race here and not in task check: it multiplies the run time,
      # and the store tests are the ones with real concurrency in them.
      - env:
          MAILYARD_TEST_DSN: postgres://mailyard:mailyard@localhost:5432/mailyard_test?sslmode=disable
        run: go test -race ./...

      # Known vulnerabilities in what the binary actually calls. The
      # dependency graph is large and this is the one check that reads
      # it against a database rather than against our own rules.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
